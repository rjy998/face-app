# ============================================================
# Nginx 配置：静态前端 + 反向代理后端 + HTTPS
# 使用方式见 deploy/deploy.sh 与 README「部署上线」
# ============================================================
upstream face_backend {
    server backend:8000;            # docker-compose 里的服务名；裸机部署改成 127.0.0.1:8000
    keepalive 32;
}

# HTTP：只保留 ACME 校验与跳转 HTTPS
server {
    listen 80;
    server_name your-domain.com;    # TODO 改成你的域名

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;    # TODO 改成你的域名

    # TODO 证书路径（certbot 生成）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 上传体积：与后端 MAX_UPLOAD_MB 保持一致（10MB + 余量）
    client_max_body_size 12m;
    client_body_timeout 60s;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端静态页面
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }

    # 接口反向代理
    location /api/ {
        proxy_pass http://face_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI 解读 + 人脸检测耗时较长，给足超时
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    # 接口文档（上线后建议关闭或加访问控制）
    location /docs {
        proxy_pass http://face_backend;
        proxy_set_header Host $host;
    }
}
